<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow セッションレポート</title>
  <style>
    body { margin: 0; background: #f5f7fa; color: #182230; font: 1rem/1.65 system-ui, sans-serif; }
    main { max-width: 68rem; margin: auto; padding: clamp(1rem, 4vw, 3rem); }
    h1, h2, h3 { line-height: 1.3; }
    section { margin-block: 2rem; }
    a { color: #17458a; }
    code { overflow-wrap: anywhere; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin: 0; }
    .comparison > div, details { background: #fff; border: 1px solid #ccd5e0; border-radius: .5rem; padding: 1rem; }
    .comparison h3 { margin-top: 0; }
    .steps li + li { margin-top: .4rem; }
    details + details { margin-top: .75rem; }
    summary { cursor: pointer; font-weight: 650; }
    @media (max-width: 42rem) { .comparison { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Flow セッションレポート</h1>
      <!-- 機能名、実装commit、review cycle、完了チェックポイント -->
    </header>
    <section>
      <h2>できるようになったこと</h2>
      <!-- 利用者や保守担当者から見た成果 -->
    </section>
    <section>
      <h2>変更前と変更後</h2>
      <figure class="comparison" aria-label="変更前後の比較">
        <div>
          <h3>変更前</h3>
          <ol class="steps"><!-- 変更前の処理や責務 --></ol>
        </div>
        <div>
          <h3>変更後</h3>
          <ol class="steps"><!-- 変更後の処理や責務 --></ol>
        </div>
      </figure>
    </section>
    <section>
      <h2>主な判断と理由</h2>
      <!-- 判断ごとに details と summary を使い、根拠への参照を添える -->
    </section>
    <section>
      <h2>検証とレビュー</h2>
      <!-- 検証結果、レビュー結果、残る制約や未確認事項 -->
    </section>
  </main>
</body>
</html>
